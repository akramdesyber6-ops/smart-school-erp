name: Quality checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feat/frontend-route-and-roster-fixes

permissions:
  contents: read

concurrency:
  group: quality-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Type check, lint, and production build
    runs-on: ubuntu-latest
    env:
      # Build-only placeholders. No live Supabase data or production secrets are used.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-anon-key-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install --global pnpm@9.15.4

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: TypeScript
        run: pnpm type-check

      - name: ESLint
        run: pnpm lint

      - name: Production build
        run: pnpm build
