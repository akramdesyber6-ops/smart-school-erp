name: Quality checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feat/frontend-route-and-roster-fixes

permissions:
  contents: read

concurrency:
  group: quality-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Type check, lint, and production build
    runs-on: ubuntu-latest
    env:
      # Build-only placeholders. No live Supabase data or production secrets are used.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-anon-key-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install --global pnpm@9.15.4

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: TypeScript
        run: pnpm type-check

      - name: Unit tests
        run: pnpm test

      - name: ESLint
        run: pnpm lint

      - name: Production build
        run: pnpm build


  database:
    name: Supabase migration and policy smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install --global pnpm@9.15.4

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Start disposable Supabase database
        # Only PostgreSQL is required for applying migrations and pgTAP tests.
        # Excluding optional API/studio/observability containers reduces Docker pulls.
        run: pnpm exec supabase start --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Apply migrations and seed locally
        run: pnpm exec supabase db reset --local

      - name: Lint database schema and functions
        run: pnpm exec supabase db lint --local --fail-on error

      - name: Test RLS/policy object coverage
        run: pnpm exec supabase test db --local

      - name: Stop disposable Supabase stack
        if: always()
        run: pnpm exec supabase stop --no-backup
